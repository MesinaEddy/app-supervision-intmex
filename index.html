<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisión Intmex - Control de Campo</title>
    <!-- Leaflet CSS para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 70px; }

        header { background: #0f172a; padding: 15px; text-align: center; border-bottom: 1px solid var(--border-color); }
        header img { max-height: 45px; width: auto; margin-bottom: 5px; object-fit: contain; }
        header h1 { font-size: 16px; color: var(--text-main); margin-top: 5px; }
        header p { font-size: 11px; color: var(--text-muted); }

        .container { max-width: 950px; margin: 0 auto; padding: 15px; }

        .gps-banner { background: #064e3b; color: #34d399; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; border: 1px solid #059669; text-align: center; }

        .section-title { font-size: 15px; font-weight: bold; color: var(--accent); margin: 25px 0 12px 0; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; text-transform: uppercase; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 768px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        .full-width { grid-column: 1 / -1; }

        .form-group { margin-bottom: 4px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        .form-control, select, textarea, input[type="text"], input[type="tel"], input[type="file"] {
            width: 100%; padding: 10px; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px;
        }
        textarea { resize: vertical; height: 75px; }

        .signature-container { background: #ffffff; border-radius: 6px; border: 1px solid var(--border-color); width: 100%; height: 160px; position: relative; touch-action: none; }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        .btn-clear { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 5px; }

        .checklist-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; }
        .checklist-item span { font-size: 13px; }
        .checklist-options { display: flex; gap: 5px; }
        .check-btn { padding: 5px 12px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-muted); border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .check-btn.active-ok { background: var(--success); color: white; border-color: #059669; }
        .check-btn.active-no { background: var(--danger); color: white; border-color: #b91c1c; }

        .btn-submit { background: var(--accent); color: #0f172a; border: none; width: 100%; padding: 14px; font-weight: bold; font-size: 15px; border-radius: 8px; cursor: pointer; margin-top: 20px; grid-column: 1 / -1; }
        .btn-submit:hover { opacity: 0.9; }

        .kpi-card { background: #1e293b; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); text-align: center; }
        .kpi-value { font-size: 22px; font-weight: bold; color: var(--text-main); margin-top: 5px; }
        .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--accent); }
        .nav-item div { font-size: 18px; margin-bottom: 2px; }

        .view-section { display: none; }
        .active-view { display: block; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo INTMEX" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
        <div id="fallback-logo" style="display:none; color: #38bdf8; font-weight: bold; font-size: 18px; margin-bottom: 2px;">INTMEX</div>
        <h1>SUPERVISION INTMEX</h1>
        <p>Control de Campo y Auditoría</p>
    </header>

    <div class="container">
        <!-- VISTA REGISTRO -->
        <div id="view-registro" class="view-section active-view">
            <div id="gps-status" class="gps-banner">📍 Obteniendo ubicación GPS...</div>

            <form id="form-supervision" class="form-grid">
                
                <div class="section-title full-width">Datos de Ruta y Asesor</div>
                
                <div class="form-group">
                    <label>CEDIS</label>
                    <select id="cedis-select" required class="form-control">
                        <option value="">Seleccione CEDIS</option>
                        <option value="TIJ">TIJUANA</option>
                        <option value="MXLI">MEXICALI</option>
                        <option value="HILLO">HERMOSILLO</option>
                        <option value="MOC">MOCHIS</option>
                        <option value="CUL">CULIACAN</option>
                        <option value="MZT">MAZATLAN</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>RUTA</label>
                    <select id="ruta-select" required class="form-control">
                        <option value="">Primero seleccione un CEDIS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre del Asesor</label>
                    <input type="text" id="asesor-input" placeholder="Ej. Carlos Gutiérrez" required>
                </div>

                <div class="form-group">
                    <label>Tipo de Ruta</label>
                    <select id="tipo-ruta-input" class="form-control">
                        <option value="Ruta Activa">Ruta Activa</option>
                        <option value="Ruta Nueva">Ruta Nueva</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Objetivo de Supervisión</label>
                    <select id="objetivo-principal" class="form-control" required>
                        <option value="">Seleccione Objetivo</option>
                        <option value="Venta">Venta</option>
                        <option value="Capacitación">Capacitación</option>
                        <option value="Territorio">Territorio</option>
                    </select>
                </div>

                <div class="form-group" id="subobjetivo-container" style="display: none;">
                    <label>Subobjetivo de Supervisión</label>
                    <select id="objetivo-detalle" class="form-control"></select>
                </div>

                <div class="section-title full-width">Datos del Cliente</div>

                <div class="form-group full-width">
                    <label>¿Cliente Abierto?</label>
                    <select id="cliente-abierto-select" class="form-control" required>
                        <option value="SI">SÍ</option>
                        <option value="NO">NO</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="cliente-input" placeholder="Ej. Mini Super Alex" required>
                </div>

                <div class="form-group full-width" id="subopcion-cerrado-container" style="display: none;">
                    <label>Tipo de Cierre / Visita</label>
                    <select id="tipo-cierre-select" class="form-control">
                        <option value="Solo esta visita">Solo esta visita</option>
                        <option value="Cerrado definitivo">Cerrado definitivo</option>
                    </select>
                </div>

                <div id="campos-cliente-abierto-extra" class="full-width" style="display: contents;">
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="telefono-input" placeholder="Ej. 6641234567">
                    </div>

                    <div class="form-group">
                        <label>¿Quién Recibe?</label>
                        <input type="text" id="quien-recibe-input" placeholder="Persona que atiende">
                    </div>

                    <div class="form-group">
                        <label>Segmento de Cliente</label>
                        <select id="tipo-cte-input" class="form-control">
                            <option value="Tipo A">Tipo A: Cobro, pasillos, refis y carnicería</option>
                            <option value="Tipo B">Tipo B: Cobro, pasillo y refrigerador</option>
                            <option value="Tipo C">Tipo C: Mostrador y pasillos limitados</option>
                            <option value="Tipo D">Tipo D: Ventanita o estanquillo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Impacto de Prioridades</label>
                        <select id="impacto-prioridades-select" class="form-control">
                            <option value="SI">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>¿Compra Efectiva?</label>
                        <select id="compra-efectiva-select" class="form-control">
                            <option value="SI">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>

                    <div class="form-group" id="motivo-no-compra-container" style="display: none;">
                        <label>Motivo de No Compra</label>
                        <select id="motivo-no-compra" class="form-control">
                            <option value="Sin Dinero">Sin Dinero</option>
                            <option value="Inventario">Inventario</option>
                            <option value="No está el encargado">No está el encargado</option>
                        </select>
                    </div>
                </div>

                <div class="section-title full-width" id="titulo-checklist">Pasos de la Visita (Checklist)</div>
                
                <div id="checklist-container" class="full-width" style="display: grid; grid-template-columns: 1fr; gap: 8px;"></div>

                <div class="form-group" id="grupo-codigos">
                    <label>Códigos sin Impactar / Comentarios</label>
                    <textarea id="codigos-input" placeholder="Ninguno"></textarea>
                </div>

                <div class="form-group" id="grupo-notas">
                    <label>Notas de Auditoría</label>
                    <textarea id="notas-input" placeholder="Observaciones adicionales..."></textarea>
                </div>

                <div class="section-title full-width">Evidencias</div>

                <div class="form-group full-width" id="grupo-firma">
                    <label>Firma del Cliente (Opcional)</label>
                    <div class="signature-container">
                        <canvas id="signature-canvas"></canvas>
                    </div>
                    <button type="button" class="btn-clear" id="clear-signature">Limpiar Firma</button>
                </div>

                <div class="form-group full-width">
                    <label>Foto de Fachada / Establecimiento (Obligatorio)</label>
                    <input type="file" id="foto-fachada" accept="image/*" capture="environment" required>
                </div>

                <button type="submit" class="btn-submit">Guardar Registro</button>
            </form>
        </div>

        <!-- VISTA HISTORIAL Y REPORTES -->
        <div id="view-historial" class="view-section"></div>

        <!-- VISTA MAPA -->
        <div id="view-mapa" class="view-section">
            <div class="section-title">Mapa de Ubicaciones en Tiempo Real</div>
            <div id="map" style="width: 100%; height: 400px; border-radius: 8px; border: 1px solid var(--border-color);"></div>
        </div>
    </div>

    <!-- Navegación Inferior -->
    <div class="bottom-nav">
        <button class="nav-item active" id="tab-registro">
            <div>📝</div>Registro
        </button>
        <button class="nav-item" id="tab-historial">
            <div>📊</div>Historial & Reportes
        </button>
        <button class="nav-item" id="tab-mapa">
            <div>🗺️</div>Mapa
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cedisSelect = document.getElementById("cedis-select");
            const rutaSelect = document.getElementById("ruta-select");
            const asesorInput = document.getElementById("asesor-input");
            const tipoRutaInput = document.getElementById("tipo-ruta-input");
            const objetivoPrincipal = document.getElementById("objetivo-principal");
            const objetivoDetalle = document.getElementById("objetivo-detalle");
            const subobjetivoContainer = document.getElementById("subobjetivo-container");

            const canvas = document.getElementById('signature-canvas');
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function resizeCanvas() {
                const ratio = Math.max(window.devicePixelRatio || 1, 1);
                canvas.width = canvas.offsetWidth * ratio;
                canvas.height = canvas.offsetHeight * ratio;
                ctx.scale(ratio, ratio);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
            }
            window.addEventListener('load', resizeCanvas);
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
            canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); });
            canvas.addEventListener('mouseup', () => { isDrawing = false; });
            canvas.addEventListener('mouseleave', () => { isDrawing = false; });

            canvas.addEventListener('touchstart', (e) => {
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                ctx.beginPath();
                ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
                e.preventDefault();
            });
            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
                ctx.stroke();
                e.preventDefault();
            });
            canvas.addEventListener('touchend', () => { isDrawing = false; });

            document.getElementById('clear-signature').addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            function poblarRutas(cedisVal, rutaSeleccionada = "") {
                rutaSelect.innerHTML = '<option value="">Seleccione una Ruta</option>';
                if (!cedisVal) return;

                for (let i = 1; i <= 18; i++) {
                    const num = i < 10 ? '0' + i : i;
                    const val = ${cedisVal}${num};
                    const opt = document.createElement("option");
                    opt.value = val;
                    opt.textContent = val;
                    if (val === rutaSeleccionada) opt.selected = true;
                    rutaSelect.appendChild(opt);
                }
                for (let i = 301; i <= 306; i++) {
                    const val = ${cedisVal}${i};
                    const opt = document.createElement("option");
                    opt.value = val;
                    opt.textContent = val;
                    if (val === rutaSeleccionada) opt.selected = true;
                    rutaSelect.appendChild(opt);
                }
            }

            function cargarMemoriaBloque1() {
                const mem = JSON.parse(localStorage.getItem("intmex_bloque1"));
                if (mem) {
                    if (mem.cedis) {
                        cedisSelect.value = mem.cedis;
                        poblarRutas(mem.cedis, mem.ruta);
                    }
                    if (mem.asesor) asesorInput.value = mem.asesor;
                    if (mem.tipoRuta) tipoRutaInput.value = mem.tipoRuta;
                    if (mem.objetivoPrincipal) {
                        objetivoPrincipal.value = mem.objetivoPrincipal;
                        actualizarSubobjetivos(mem.objetivoPrincipal, mem.objetivoDetalle);
                    }
                }
            }

            function actualizarSubobjetivos(val, detalleSeleccionado = "") {
                objetivoDetalle.innerHTML = "";
                if (val === "Venta") {
                    subobjetivoContainer.style.display = "block";
                    ["Efectividad de Venta", "Impulso"].forEach(sub => {
                        const opt = document.createElement("option");
                        opt.value = sub;
                        opt.textContent = sub;
                        if (sub === detalleSeleccionado) opt.selected = true;
                        objetivoDetalle.appendChild(opt);
                    });
                } else if (val === "Capacitación" || val === "Territorio") {
                    subobjetivoContainer.style.display = "block";
                    ["Nuevo Ingreso", "Reestructura"].forEach(sub => {
                        const opt = document.createElement("option");
                        opt.value = sub;
                        opt.textContent = sub;
                        if (sub === detalleSeleccionado) opt.selected = true;
                        objetivoDetalle.appendChild(opt);
                    });
                } else {
                    subobjetivoContainer.style.display = "none";
                }
            }

            cedisSelect.addEventListener("change", function() {
                poblarRutas(this.value);
                guardarMemoriaBloque1();
            });

            [rutaSelect, asesorInput, tipoRutaInput, objetivoPrincipal, objetivoDetalle].forEach(el => {
                el.addEventListener("change", guardarMemoriaBloque1);
                el.addEventListener("input", guardarMemoriaBloque1);
            });

            objetivoPrincipal.addEventListener("change", function() {
                actualizarSubobjetivos(this.value);
            });

            function guardarMemoriaBloque1() {
                const data = {
                    cedis: cedisSelect.value,
                    ruta: rutaSelect.value,
                    asesor: asesorInput.value,
                    tipoRuta: tipoRutaInput.value,
                    objetivoPrincipal: objetivoPrincipal.value,
                    objetivoDetalle: objetivoDetalle.value
                };
                localStorage.setItem("intmex_bloque1", JSON.stringify(data));
            }

            cargarMemoriaBloque1();

            const clienteAbiertoSelect = document.getElementById("cliente-abierto-select");
            const camposClienteAbiertoExtra = document.getElementById("campos-cliente-abierto-extra");
            const subopcionCerradoContainer = document.getElementById("subopcion-cerrado-container");
            const checklistContainer = document.getElementById("checklist-container");
            const tituloChecklist = document.getElementById("titulo-checklist");
            const grupoCodigos = document.getElementById("grupo-codigos");
            const grupoNotas = document.getElementById("grupo-notas");
            const grupoFirma = document.getElementById("grupo-firma");

            clienteAbiertoSelect.addEventListener("change", function() {
                if (this.value === "NO") {
                    camposClienteAbiertoExtra.style.display = "none";
                    subopcionCerradoContainer.style.display = "block";
                    checklistContainer.style.display = "none";
                    tituloChecklist.style.display = "none";
                    grupoCodigos.style.display = "none";
                    grupoNotas.style.display = "none";
                    grupoFirma.style.display = "none";
                } else {
                    camposClienteAbiertoExtra.style.display = "contents";
                    subopcionCerradoContainer.style.display = "none";
                    checklistContainer.style.display = "grid";
                    tituloChecklist.style.display = "block";
                    grupoCodigos.style.display = "block";
                    grupoNotas.style.display = "block";
                    grupoFirma.style.display = "block";
                }
            });

            const compraEfectivaSelect = document.getElementById("compra-efectiva-select");
            const motivoNoCompraContainer = document.getElementById("motivo-no-compra-container");

            compraEfectivaSelect.addEventListener("change", function() {
                motivoNoCompraContainer.style.display = this.value === "NO" ? "block" : "none";
            });

            const pasosChecklist = [
                "ID Cliente en Base de Datos", "Saludo a Cliente", "ID Nuestras Marcas",
                "ID Stock", "Revisión de Caducidades", "Impulso de Variantes",
                "Cierre Promos", "Comunicar Venta a Cliente", "Manejo de Objecciones", "Despedida"
            ];

            const checklistEl = document.getElementById("checklist-container");
            pasosChecklist.forEach((paso, index) => {
                const div = document.createElement("div");
                div.className = "checklist-item";
                div.innerHTML = `
                    <span>${index + 1}. ${paso}</span>
                    <div class="checklist-options">
                        <button type="button" class="check-btn" onclick="marcarCheck(${index}, 'SI', this)">SÍ</button>
                        <button type="button" class="check-btn" onclick="marcarCheck(${index}, 'NO', this)">NO</button>
                    </div>
                `;
                checklistEl.appendChild(div);
            });

            window.checklistEstado = {};
            window.marcarCheck = function(index, valor, btn) {
                const parent = btn.parentElement;
                parent.querySelectorAll('.check-btn').forEach(b => b.classList.remove('active-ok', 'active-no'));
                if(valor === 'SI') btn.classList.add('active-ok');
                else btn.classList.add('active-no');
                window.checklistEstado[index] = valor;
            };

            let currentLat = 32.4703;
            let currentLng = -116.8378;
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    document.getElementById("gps-status").innerText = 📍 GPS Activo: ${currentLat.toFixed(4)}, ${currentLng.toFixed(4)};
                });
            }

            const form = document.getElementById("form-supervision");
            form.addEventListener("submit", e => {
                e.preventDefault();
                const fotoInput = document.getElementById("foto-fachada");
                if (!fotoInput.files || fotoInput.files.length === 0) {
                    alert("⚠️ Es obligatorio tomar o adjuntar la foto de la fachada.");
                    fotoInput.focus();
                    return;
                }

                // Función segura para comprimir la imagen y evitar errores de memoria en celulares
                const file = fotoInput.files[0];
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvasImg = document.createElement('canvas');
                        const MAX_WIDTH = 800; // Ancho optimizado para reportes y evitar saturar memoria
                        const scaleSize = MAX_WIDTH / img.width;
                        canvasImg.width = MAX_WIDTH;
                        canvasImg.height = img.height * (scaleSize < 1 ? scaleSize : 1);

                        const ctxImg = canvasImg.getContext('2d');
                        ctxImg.drawImage(img, 0, 0, canvasImg.width, canvasImg.height);
                        
                        // Comprimir a formato JPEG con calidad del 70% para evitar "Memoria insuficiente"
                        const fotoBase64 = canvasImg.toDataURL('image/jpeg', 0.7);
                        const firmaBase64 = !isCanvasBlank(canvas) ? canvas.toDataURL('image/png', 0.7) : "";

                        const abierto = clienteAbiertoSelect.value;
                        let puntaje = 0;
                        let calificacion = "N/A (CERRADO)";
                        let tipoCierre = "-";

                        if (abierto === "SI") {
                            Object.values(window.checklistEstado).forEach(v => {
                                if (v === "SI") puntaje += 10;
                            });
                            if (puntaje >= 70) calificacion = "OK";
                            else if (puntaje >= 50) calificacion = "OCUPA REFUERZO";
                            else calificacion = "OCUPA CAPACITACION";
                        } else {
                            tipoCierre = document.getElementById("tipo-cierre-select").value;
                        }

                        const registro = {
                            fecha: new Date().toLocaleString(),
                            cedis: cedisSelect.value,
                            ruta: rutaSelect.value,
                            asesor: asesorInput.value,
                            tipoRuta: tipoRutaInput.value,
                            objetivo: objetivoPrincipal.value + (subobjetivoContainer.style.display !== 'none' ? ` (${objetivoDetalle.value})` : ''),
                            clienteAbierto: abierto,
                            tipoCierre: tipoCierre,
                            cliente: document.getElementById("cliente-input").value,
                            telefono: abierto === "SI" ? document.getElementById("telefono-input").value : "",
                            quienRecibe: abierto === "SI" ? document.getElementById("quien-recibe-input").value : "",
                            tipoCliente: abierto === "SI" ? document.getElementById("tipo-cte-input").value : "-",
                            impactoPrioridades: abierto === "SI" ? document.getElementById("impacto-prioridades-select").value : "-",
                            compraEfectiva: abierto === "SI" ? compraEfectivaSelect.value : "NO",
                            motivoNoCompra: abierto === "SI" && compraEfectivaSelect.value === "NO" ? document.getElementById("motivo-no-compra").value : "-",
                            codigos: abierto === "SI" ? document.getElementById("codigos-input").value : "-",
                            notas: abierto === "SI" ? document.getElementById("notas-input").value : Cierre: ${tipoCierre},
                            puntaje: puntaje,
                            calificacion: calificacion,
                            lat: currentLat,
                            lng: currentLng,
                            foto: fotoBase64,
                            firma: firmaBase64
                        };

                        let registros = JSON.parse(localStorage.getItem("registros_supervision")) || [];
                        registros.push(registro);
                        localStorage.setItem("registros_supervision", JSON.stringify(registros));

                        alert(¡Guardado con éxito! Calificación: ${calificacion});
                        
                        document.getElementById("cliente-input").value = "";
                        document.getElementById("telefono-input").value = "";
                        document.getElementById("quien-recibe-input").value = "";
                        document.getElementById("codigos-input").value = "";
                        document.getElementById("notas-input").value = "";
                        document.getElementById("foto-fachada").value = "";
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        
                        document.querySelectorAll('.check-btn').forEach(b => b.classList.remove('active-ok', 'active-no'));
                        window.checklistEstado = {};

                        if(clienteAbiertoSelect.value === "NO") {
                            clienteAbiertoSelect.value = "SI";
                            clienteAbiertoSelect.dispatchEvent(new Event('change'));
                        }
                    };
                };
            });

            function isCanvasBlank(cvs) {
                const blank = document.createElement('canvas');
                blank.width = cvs.width;
                blank.height = cvs.height;
                return cvs.toDataURL() === blank.toDataURL();
            }

            const tabReg = document.getElementById("tab-registro");
            const tabHist = document.getElementById("tab-historial");
            const tabMap = document.getElementById("tab-mapa");
            const viewReg = document.getElementById("view-registro");
            const viewHist = document.getElementById("view-historial");
            const viewMap = document.getElementById("view-mapa");

            function cambiarVista(actBtn, actView) {
                [tabReg, tabHist, tabMap].forEach(b => b.classList.remove("active"));
                [viewReg, viewHist, viewMap].forEach(v => v.classList.remove("active-view"));
                actBtn.classList.add("active");
                actView.classList.add("active-view");
            }

            tabReg.addEventListener("click", () => cambiarVista(tabReg, viewReg));
            tabHist.addEventListener("click", () => {
                cambiarVista(tabHist, viewHist);
                renderHistorial();
            });
            tabMap.addEventListener("click", () => {
                cambiarVista(tabMap, viewMap);
                initMap();
            });

            function renderHistorial() {
                const registros = JSON.parse(localStorage.getItem("registros_supervision")) || [];
                
                const total = registros.length;
                let abiertos = registros.filter(r => r.clienteAbierto === 'SI');
                let efectivos = abiertos.filter(r => r.compraEfectiva === 'SI').length;
                let impactoSi = abiertos.filter(r => r.impactoPrioridades === 'SI').length;

                let pctAbiertos = total > 0 ? ((abiertos.length / total) * 100).toFixed(1) : 0;
                let pctEfectivos = abiertos.length > 0 ? ((efectivos / abiertos.length) * 100).toFixed(1) : 0;
                let pctImpacto = abiertos.length > 0 ? ((impactoSi / abiertos.length) * 100).toFixed(1) : 0;

                let segA = abiertos.filter(r => r.tipoCliente === 'Tipo A').length;
                let segB = abiertos.filter(r => r.tipoCliente === 'Tipo B').length;
                let segC = abiertos.filter(r => r.tipoCliente === 'Tipo C').length;
                let segD = abiertos.filter(r => r.tipoCliente === 'Tipo D').length;

                let sumaPuntajes = abiertos.reduce((acc, r) => acc + r.puntaje, 0);
                let promedioPuntaje = abiertos.length > 0 ? (sumaPuntajes / abiertos.length).toFixed(1) : 0;

                let calificacionAsesor = "EXCELENTE (OK)";
                let colorAsesor = "#10b981";
                if (promedioPuntaje < 50) {
                    calificacionAsesor = "REQUIERE CAPACITACIÓN";
                    colorAsesor = "#ef4444";
                } else if (promedioPuntaje < 70) {
                    calificacionAsesor = "REQUIERE REFUERZO";
                    colorAsesor = "#f59e0b";
                }

                let html = `
                    <div class="section-title">📊 Panel Ejecutivo Gerencial de Supervisión</div>
                    
                    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                        <button onclick="exportarCSVBaseDatos()" style="background: #2563eb; color: white; border: none; padding: 12px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">📥 CSV Base de Datos</button>
                        <button onclick="exportarReporteEjecutivoHTML()" style="background: #10b981; color: white; border: none; padding: 12px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">📈 Ver Reporte Visual</button>
                        <button onclick="exportarReporteExcelConFotos()" style="background: #f59e0b; color: #0f172a; border: none; padding: 12px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">📑 Descargar Excel con Fotos</button>
                        <button onclick="localStorage.removeItem('registros_supervision'); renderHistorial();" style="background: #ef4444; color: white; border: none; padding: 12px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;">🗑️ Borrar</button>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px;">
                        <div class="kpi-card"><div class="kpi-label">Total Visitas</div><div class="kpi-value">${total}</div></div>
                        <div class="kpi-card" style="border-left-color: #10b981;"><div class="kpi-label">% Clientes Abiertos</div><div class="kpi-value" style="color: #34d399;">${pctAbiertos}%</div></div>
                        <div class="kpi-card" style="border-left-color: #f59e0b;"><div class="kpi-label">% Compra Efectiva</div><div class="kpi-value" style="color: #fbbf24;">${pctEfectivos}%</div></div>
                        <div class="kpi-card" style="border-left-color: #38bdf8;"><div class="kpi-label">% Impacto Prioridades</div><div class="kpi-value" style="color: #38bdf8;">${pctImpacto}%</div></div>
                    </div>

                    <div style="background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 25px;">
                        <h3 style="font-size: 14px; color: var(--accent); margin-bottom: 10px;">EVALUACIÓN Y CALIFICACIÓN DEL ASESOR</h3>
                        <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Promedio General de Checklist: <b style="color: #fff; font-size: 16px;">${promedioPuntaje} pts / 100</b></div>
                        <div style="padding: 10px; background: #0f172a; border-radius: 6px; border-left: 4px solid ${colorAsesor}; font-size: 14px;">
                            Estatus de Desempeño: <b style="color: ${colorAsesor};">${calificacionAsesor}</b>
                        </div>
                    </div>

                    <div style="background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 25px;">
                        <h3 style="font-size: 14px; color: var(--accent); margin-bottom: 15px;">DISTRIBUCIÓN DE CLIENTES SEGMENTADOS</h3>
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; font-size: 12px;">
                            <div style="background: #0f172a; padding: 10px; border-radius: 6px;"><div style="color:var(--text-muted)">Tipo A</div><div style="font-size:16px; font-weight:bold; color:#38bdf8">${segA}</div></div>
                            <div style="background: #0f172a; padding: 10px; border-radius: 6px;"><div style="color:var(--text-muted)">Tipo B</div><div style="font-size:16px; font-weight:bold; color:#34d399">${segB}</div></div>
                            <div style="background: #0f172a; padding: 10px; border-radius: 6px;"><div style="color:var(--text-muted)">Tipo C</div><div style="font-size:16px; font-weight:bold; color:#fbbf24">${segC}</div></div>
                            <div style="background: #0f172a; padding: 10px; border-radius: 6px;"><div style="color:var(--text-muted)">Tipo D</div><div style="font-size:16px; font-weight:bold; color:#f87171">${segD}</div></div>
                        </div>
                    </div>

                    <div class="section-title">Registro Detallado</div>
                `;

                if (registros.length === 0) {
                    html += <p style="color:var(--text-muted)">No hay registros guardados en el dispositivo.</p>;
                } else {
                    registros.forEach(r => {
                        html += `<div style="background:var(--bg-card); padding:12px; border-radius:8px; margin-bottom:10px; border-left:4px solid ${r.clienteAbierto==='SI'?'#10b981':'#ef4444'}">
                            <b>${r.cliente}</b> (${r.cedis} - ${r.ruta})<br>
                            <small>Fecha: ${r.fecha} | Asesor: ${r.asesor} | Segmento: ${r.tipoCliente}</small><br>
                            <small>Estado: <b>${r.clienteAbierto === 'SI' ? 'Abierto (' + r.calificacion + ')' : 'Cerrado'}</b> | Compra: <b>${r.compraEfectiva}</b> | Impacto Prioridades: <b>${r.impactoPrioridades}</b></small>
                        </div>`;
                    });
                }
                viewHist.innerHTML = html;
            }

            let mapInitialized = false;
            let leafletMap = null;
            function initMap() {
                const registros = JSON.parse(localStorage.getItem("registros_supervision")) || [];
                if (!mapInitialized) {
                    leafletMap = L.map('map').setView([currentLat, currentLng], 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(leafletMap);
                    mapInitialized = true;
                } else {
                    leafletMap.invalidateSize();
                }

                registros.forEach(r => {
                    if(r.lat && r.lng) {
                        L.marker([r.lat, r.lng]).addTo(leafletMap)
                          .bindPopup(<b>${r.cliente}</b><br>Ruta: ${r.ruta}<br>Estado: ${r.clienteAbierto === 'SI' ? 'Abierto' : 'Cerrado'});
                    }
                });
            }
        });

        window.exportarCSVBaseDatos = function() {
            const registros = JSON.parse(localStorage.getItem("registros_supervision")) || [];
            if (registros.length === 0) { alert("No hay datos para exportar"); return; }

            let csv = "\uFEFFFecha,CEDIS,Ruta,Asesor,Tipo Ruta,Objetivo,Cliente Abierto,Tipo Cierre,Cliente,Teléfono,Atiende,Segmento,Impacto Prioridades,Compra Efectiva,Motivo No Compra,Puntaje,Calificación,Códigos,Notas,Latitud,Longitud\n";
            registros.forEach(r => {
                csv += "${r.fecha}","${r.cedis}","${r.ruta}","${r.asesor}","${r.tipoRuta}","${r.objetivo}","${r.clienteAbierto}","${r.tipoCierre}","${r.cliente}","${r.telefono}","${r.quienRecibe}","${r.tipoCliente}","${r.impactoPrioridades}","${r.compraEfectiva}","${r.motivoNoCompra}",${r.puntaje},"${r.calificacion}","${r.codigos}","${r.notas}",${r.lat},${r.lng}\n;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = BaseDatos_Supervision_${new Date().toISOString().slice(0,10)}.csv;
            a.click();
        };

        window.exportarReporteEjecutivoHTML = function() {
            const registros = JSON.parse(localStorage.getItem("registros_supervision")) || [];
            if (registros.length === 0) { alert("No hay datos para generar el reporte ejecutivo"); return; }

            let win = window.open('', '_blank');
            let html = <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Reporte Ejecutivo Gerencial</title><style>body{font-family:Arial,sans-serif;padding:20px;text-align:center;}table{width:100%;border-collapse:collapse;font-size:11px;margin-top:20px;text-align:left;}th,td{border:1px solid #cbd5e1;padding:6px;}th{background:#0f172a;color:#fff;}.foto-min{max-height:60px;width:auto;}</style></head><body><h1>REPORTE EJECUTIVO CON EVIDENCIAS</h1><table><thead><tr><th>Fecha</th><th>Ruta</th><th>Asesor</th><th>Cliente</th><th>Calificación</th><th>Foto Fachada</th><th>Firma</th></tr></thead><tbody>;
            registros.forEach(r => {
                html += <tr><td>${r.fecha}</td><td>${r.ruta}</td><td>${r.asesor}</td><td>${r.cliente}</td><td><b>${r.calificacion}</b></td><td>${r.foto ? '<img src="'+r.foto+'" class="foto-min">' : 'Sin foto'}</td><td>${r.firma ? '<img src="'+r.firma+'" class="foto-min">' : 'Sin firma'}</td></tr>;
            });
            html += </tbody></table></body></html>;
            win.document.write(html);
            win.document.close();
            win.print();
        };

        window.exportarReporteExcelConFotos = function() {
            const registros = JSON.parse(localStorage.getItem("registros_supervision")) || [];
            if (registros.length === 0) { alert("No hay datos para exportar"); return; }

            let excelContent = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="UTF-8"><title>Reporte Ejecutivo Excel</title>
                <style>table{border-collapse:collapse;}th,td{border:1px solid black;padding:8px;vertical-align:middle;text-align:center;}th{background:#0f172a;color:white;}.foto-celda{max-width:100px;max-height:80px;}</style>
                </head>
                <body>
                <h2>REPORTE EJECUTIVO DE SUPERVISIÓN CON FOTOGRAFÍAS</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>CEDIS</th>
                            <th>Ruta</th>
                            <th>Asesor</th>
                            <th>Cliente</th>
                            <th>Estado</th>
                            <th>Segmento</th>
                            <th>Impacto Prioridades</th>
                            <th>Compra</th>
                            <th>Calificación</th>
                            <th>Foto de Fachada</th>
                            <th>Firma del Cliente</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            registros.forEach(r => {
                excelContent += `
                    <tr>
                        <td>${r.fecha}</td>
                        <td>${r.cedis}</td>
                        <td>${r.ruta}</td>
                        <td>${r.asesor}</td>
                        <td>${r.cliente}</td>
                        <td>${r.clienteAbierto === 'SI' ? 'Abierto' : 'Cerrado'}</td>
                        <td>${r.tipoCliente}</td>
                        <td>${r.impactoPrioridades}</td>
                        <td>${r.compraEfectiva}</td>
                        <td><b>${r.calificacion}</b> (${r.puntaje} pts)</td>
                        <td>${r.foto ? <img src="${r.foto}" class="foto-celda"> : 'Sin foto'}</td>
                        <td>${r.firma ? <img src="${r.firma}" class="foto-celda"> : 'Sin firma'}</td>
                    </tr>
                `;
            });

            excelContent += </tbody></table></body></html>;

            const blob = new Blob([excelContent], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = Reporte_Ejecutivo_Con_Fotos_${new Date().toISOString().slice(0,10)}.xls;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>
</body>
</html>
