<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisión Intmex - Control de Campo</title>
    <!-- Leaflet CSS para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 70px; }

        header { background: #0f172a; padding: 15px; text-align: center; border-bottom: 1px solid var(--border-color); }
        header img { max-height: 45px; width: auto; margin-bottom: 5px; object-fit: contain; }
        header h1 { font-size: 16px; color: var(--text-main); margin-top: 5px; }
        header p { font-size: 11px; color: var(--text-muted); }

        .container { max-width: 950px; margin: 0 auto; padding: 15px; }

        .gps-banner { background: #064e3b; color: #34d399; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; border: 1px solid #059669; text-align: center; }

        .section-title { font-size: 15px; font-weight: bold; color: var(--accent); margin: 25px 0 12px 0; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; text-transform: uppercase; }

        /* Adaptabilidad: 1 columna en celulares, 2 columnas en tablets/PC */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 768px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        .full-width { grid-column: 1 / -1; }

        .form-group { margin-bottom: 4px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        .form-control, select, textarea, input[type="text"], input[type="tel"], input[type="file"] {
            width: 100%; padding: 10px; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px;
        }
        textarea { resize: vertical; height: 75px; }

        /* Lienzo de Firma Digital */
        .signature-container { background: #ffffff; border-radius: 6px; border: 1px solid var(--border-color); width: 100%; height: 160px; position: relative; touch-action: none; }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        .btn-clear { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 5px; }

        /* Checklist interactivo */
        .checklist-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; }
        .checklist-item span { font-size: 13px; }
        .checklist-options { display: flex; gap: 5px; }
        .check-btn { padding: 5px 12px; border: 1px solid var(--border-color); background: #0f172a; color: var(--text-muted); border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .check-btn.active-ok { background: var(--success); color: white; border-color: #059669; }
        .check-btn.active-no { background: var(--danger); color: white; border-color: #b91c1c; }

        .btn-submit { background: var(--accent); color: #0f172a; border: none; width: 100%; padding: 14px; font-weight: bold; font-size: 15px; border-radius: 8px; cursor: pointer; margin-top: 20px; grid-column: 1 / -1; }
        .btn-submit:hover { opacity: 0.9; }

        /* Estilo para los reportes gerenciales */
        .kpi-card { background: #1e293b; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); text-align: center; }
        .kpi-value { font-size: 22px; font-weight: bold; color: var(--text-main); margin-top: 5px; }
        .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

        /* Barra de Navegación Inferior */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--accent); }
        .nav-item div { font-size: 18px; margin-bottom: 2px; }

        .view-section { display: none; }
        .active-view { display: block; }
    </style>
</head>
<body>

    <header>
        <!-- Logotipo local -->
        <img src="logo.png" alt="Logo INTMEX" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
        <div id="fallback-logo" style="display:none; color: #38bdf8; font-weight: bold; font-size: 18px; margin-bottom: 2px;">INTMEX</div>
        
        <h1>SUPERVISION INTMEX</h1>
        <p>Control de Campo y Auditoría</p>
    </header>

    <div class="container">
        <!-- VISTA REGISTRO -->
        <div id="view-registro" class="view-section active-view">
            <div id="gps-status" class="gps-banner">📍 Obteniendo ubicación GPS...</div>

            <form id="form-supervision" class="form-grid">

                <!-- Bloque 1: Datos de Ruta y Asesor -->
                <div class="section-title full-width">Datos de Ruta y Asesor</div>

                <div class="form-group">
                    <label>CEDIS</label>
                    <select id="cedis-select" required class="form-control">
                        <option value="">Seleccione CEDIS</option>
                        <option value="TIJ">TIJUANA</option>
                        <option value="MXLI">MEXICALI</option>
                        <option value="HILLO">HERMOSILLO</option>
                        <option value="MOC">MOCHIS</option>
                        <option value="CUL">CULIACAN</option>
                        <option value="MZT">MAZATLAN</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>RUTA</label>
                    <select id="ruta-select" required class="form-control">
                        <option value="">Primero seleccione un CEDIS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre del Asesor</label>
                    <input type="text" id="asesor-input" placeholder="Ej. Carlos Gutiérrez" required>
                </div>

                <div class="form-group">
                    <label>Tipo de Ruta</label>
                    <select id="tipo-ruta-input" class="form-control">
                        <option value="Ruta Activa">Ruta Activa</option>
                        <option value="Ruta Nueva">Ruta Nueva</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Objetivo de Supervisión</label>
                    <select id="objetivo-principal" class="form-control" required>
                        <option value="">Seleccione Objetivo</option>
                        <option value="Venta">Venta</option>
                        <option value="Capacitación">Capacitación</option>
                        <option value="Territorio">Territorio</option>
                    </select>
                </div>

                <div class="form-group" id="subobjetivo-container" style="display: none;">
                    <label>Subobjetivo de Supervisión</label>
                    <select id="objetivo-detalle" class="form-control"></select>
                </div>

                <!-- Bloque 2: Datos del Cliente -->
                <div class="section-title full-width">Datos del Cliente</div>

                <div class="form-group full-width">
                    <label>¿Cliente Abierto?</label>
                    <select id="cliente-abierto-select" class="form-control" required>
                        <option value="SI">SÍ</option>
                        <option value="NO">NO</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="cliente-input" placeholder="Ej. Mini Super Alex" required>
                </div>

                <div class="form-group full-width" id="subopcion-cerrado-container" style="display: none;">
                    <label>Tipo de Cierre / Visita</label>
                    <select id="tipo-cierre-select" class="form-control">
                        <option value="Solo esta visita">Solo esta visita</option>
                        <option value="Cerrado definitivo">Cerrado definitivo</option>
                    </select>
                </div>

                <div id="campos-cliente-abierto-extra" class="full-width" style="display: contents;">
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="telefono-input" placeholder="Ej. 6641234567">
                    </div>

                    <div class="form-group">
                        <label>¿Quién Recibe?</label>
                        <input type="text" id="quien-recibe-input" placeholder="Persona que atiende">
                    </div>

                    <div class="form-group">
                        <label>Segmento de Cliente</label>
                        <select id="tipo-cte-input" class="form-control">
                            <option value="Tipo A">Tipo A: Cobro, pasillos, refis y carnicería</option>
                            <option value="Tipo B">Tipo B: Cobro, pasillo y refrigerador</option>
                            <option value="Tipo C">Tipo C: Mostrador y pasillos limitados</option>
                            <option value="Tipo D">Tipo D: Ventanita o estanquillo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Impacto de Prioridades</label>
                        <select id="impacto-prioridades-select" class="form-control">
                            <option value="SI">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>¿Compra Efectiva?</label>
                        <select id="compra-efectiva-select" class="form-control">
                            <option value="SI">SÍ</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>

                    <div class="form-group" id="motivo-no-compra-container" style="display: none;">
                        <label>Motivo de No Compra</label>
                        <select id="motivo-no-compra" class="form-control">
                            <option value="Sin Dinero">Sin Dinero</option>
                            <option value="Inventario">Inventario</option>
                            <option value="No está el encargado">No está el encargado</option>
                        </select>
                    </div>
                </div>

                <!-- Bloque 3: Pasos de la Visita (Checklist) -->
                <div class="section-title full-width" id="titulo-checklist">Pasos de la Visita (Checklist)</div>

                <div id="checklist-container" class="full-width" style="display: grid; grid-template-columns: 1fr; gap: 8px;"></div>

                <div class="form-group" id="grupo-codigos">
                    <label>Códigos sin Impactar / Comentarios</label>
                    <textarea id="codigos-input" placeholder="Ninguno"></textarea>
                </div>

                <div class="form-group" id="grupo-notas">
                    <label>Notas de Auditoría</label>
                    <textarea id="notas-input" placeholder="Observaciones adicionales..."></textarea>
                </div>

                <!-- Bloque 4: Evidencias -->
                <div class="section-title full-width">Evidencias</div>

                <div class="form-group full-width" id="grupo-firma">
                    <label>Firma del Cliente (Opcional)</label>
                    <div class="signature-container">
                        <canvas id="signature-canvas"></canvas>
                    </div>
                    <button type="button" class="btn-clear" id="clear-signature">Limpiar Firma</button>
                </div>

                <div class="form-group full-width">
                    <label>Foto de Fachada / Establecimiento (Obligatorio)</label>
                    <input type="file" id="foto-fachada" accept="image/*" capture="environment" required>
                </div>

                <button type="submit" class="btn-submit">Guardar Registro</button>
            </form>
        </div>

        <!-- VISTA HISTORIAL Y REPORTES -->
        <div id="view-historial" class="view-section"></div>

        <!-- VISTA MAPA -->
        <div id="view-mapa" class="view-section">
            <div class="section-title">Mapa de Ubicaciones en Tiempo Real</div>
            <div id="map" style="width: 100%; height: 400px; border-radius: 8px; border: 1px solid var(--border-color);"></div>
        </div>
    </div>

    <!-- Navegación Inferior -->
    <div class="bottom-nav">
        <button class="nav-item active" id="tab-registro">
            <div>📝</div>Registro
        </button>
        <button class="nav-item" id="tab-historial">
            <div>📊</div>Historial & Reportes
        </button>
        <button class="nav-item" id="tab-mapa">
            <div>🗺️</div>Mapa
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

   <!-- Tu script principal externo -->
   <script src="script.js?v=100"></script>
