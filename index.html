<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERVISION INTMEX</title>
    <!-- Leaflet CSS para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            text-align: center;
            padding: 15px 10px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .header img {
            max-height: 45px;
            width: auto;
            margin-bottom: 5px;
            object-fit: contain;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
            padding-bottom: 90px; /* Espacio para la barra inferior */
        }
        .section-title {
            font-size: 16px;
            color: #38bdf8;
            margin-bottom: 8px;
            margin-top: 20px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button.btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        button.btn-primary:hover {
            background: #1d4ed8;
        }
        /* Barra de navegación inferior */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-item span.icon {
            font-size: 20px;
        }
        .view-section {
            display: none;
        }
        .view-section.active-view {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Cabecera apuntando a tu logo local en el repositorio -->
    <div class="header">
        <!-- CAMBIA 'logo.png' por el nombre exacto de tu archivo de imagen en GitHub -->
        <img src="logo.png" alt="Logo INTMEX" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
        <div id="fallback-logo" style="display:none; color: #38bdf8; font-weight: bold; font-size: 18px; margin-bottom: 5px;">INTMEX</div>
        
        <h1 style="font-size: 15px; color: #fff; margin: 4px 0 0 0;">SUPERVISION INTMEX</h1>
        <p style="font-size: 11px; color: #94a3b8; margin: 2px 0 0 0;">Control de Campo y Auditoría</p>
    </div>

    <!-- VISTA 1: REGISTRO -->
    <div id="view-registro" class="view-section active-view">
        <div class="container">
            <!-- Estado del GPS -->
            <div id="gps-status" style="margin-bottom: 15px;">
                <div style="background: #1e293b; color: #38bdf8; padding: 10px; border-radius: 6px; border: 1px solid #334155;">
                    <b>Buscando ubicación GPS...</b><br><small>Esperando señal de satélite...</small>
                </div>
            </div>

            <form id="form-supervision">
                <div class="section-title">Datos de Ruta y Asesor</div>
                
                <div class="form-group">
                    <label>CEDIS</label>
                    <select id="cedis-select" required>
                        <option value="">Seleccione CEDIS</option>
                        <option value="TIJUANA">TIJUANA</option>
                        <option value="MEXICALI">MEXICALI</option>
                        <option value="HERMOSILLO">HERMOSILLO</option>
                        <option value="MOCHIS">MOCHIS</option>
                        <option value="CULIACAN">CULIACAN</option>
                        <option value="MAZATLAN">MAZATLAN</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ruta</label>
                    <select id="ruta-select" required>
                        <option value="">Primero seleccione un CEDIS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre del Asesor</label>
                    <input type="text" id="asesor-input" placeholder="Ej. Carlos Gutiérrez" required>
                </div>

                <div class="section-title">Datos Generales del Cliente</div>
                
                <div class="form-group">
                    <label>Nombre del Cliente</label>
                    <input type="text" id="cliente-input" placeholder="Ej. Mini Super Alex" required>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" id="telefono-input" placeholder="Ej. 6641234567">
                </div>

                <div class="form-group">
                    <label>¿Quién Recibe?</label>
                    <input type="text" id="quien-recibe-input" placeholder="Nombre de la persona que atiende">
                </div>

                <div class="form-group">
                    <label>Tipo de Cliente</label>
                    <select id="tipo-cte-input">
                        <option value="A">Tipo A</option>
                        <option value="B">Tipo B</option>
                        <option value="C">Tipo C</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Códigos sin Impactar / Comentarios</label>
                    <textarea id="codigos-input" rows="2" placeholder="Ninguno"></textarea>
                </div>

                <div class="form-group">
                    <label>Notas de Auditoría</label>
                    <textarea id="notas-input" rows="3" placeholder="Observaciones adicionales..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Guardar Registro</button>
            </form>
        </div>
    </div>

    <!-- VISTA 2: HISTORIAL -->
    <div id="view-historial" class="view-section"></div>

    <!-- VISTA 3: MAPA -->
    <div id="view-mapa" class="view-section"></div>

    <!-- BARRA DE NAVEGACIÓN INFERIOR -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="tab-registro">
            <span class="icon">📝</span>
            <span>Registro</span>
        </button>
        <button class="nav-item" id="tab-historial">
            <span class="icon">📊</span>
            <span>Historial</span>
        </button>
        <button class="nav-item" id="tab-mapa">
            <span class="icon">🗺️</span>
            <span>Mapa</span>
        </button>
    </nav>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Tu archivo script.js -->
    <script src="script.js"></script>
</body>
</html>
